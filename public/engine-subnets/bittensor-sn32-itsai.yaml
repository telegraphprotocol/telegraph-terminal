version: "1"
kind: subnet
id: 32
slug: bittensor-sn32-itsai
protocol: bittensor
name: ItsAI Text Detector (Bittensor SN32)
description: >
  Bittensor Subnet 32 — ItsAI detects whether text was written by a human or
  generated by an AI. No API key required. The autonomous engine can use ItsAI
  for content authenticity verification before acting on text-based signals.

base_url: https://api.its-ai.org/api

auth:
  type: header
  env_var: SUBNET_32_API_KEY
  header_name: Authorization
  # Value in env must include the scheme prefix: APIKey <your_key>
  # e.g. SUBNET_32_API_KEY=APIKey sk-xxxxxxxxxxxxxxxx

rate_limit_per_sec: 10
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /detect
    external_path: /text
    method: POST
    description: Detect whether a piece of text is AI-generated.

input_schema:
  type: object
  required: [text]
  properties:
    text:
      type: string
      minLength: 200
      description: The text sample to analyze for AI authorship (minimum 200 characters).
    deep_scan:
      type: boolean
      description: When true, returns per-sentence scores in addition to the overall result.

output_schema:
  type: object
  properties:
    answer:
      type: integer
      enum: [0, 1]
      description: >
        1 = AI-generated, 0 = human-written.
    status:
      type: string
      description: "success or error"
    segmentation_tokens:
      type: array
      description: Per-sentence scores when deep_scan is true.

semantics:
  signal_mapping:
    type: text_authenticity
    confidence_field: answer
    label_field: answer
  supported_intents:
    - TEXT_AUTHENTICITY_CHECK
    - AI_TEXT_DETECTION
    - CONTENT_VERIFICATION
# on_chain: layout for detect endpoint.
# Response: {answer: 0|1, status: "success"|"error", segmentation_tokens: [...]}
# answer=1 means AI-generated, answer=0 means human. No continuous confidence field.
# transform=direct: clean integer-to-bool conversion via transform_rule.
#
# On-chain array layout (adaptable to any binary AI text detection API):
#   bools[0] = is_ai_text    (true if text is AI-generated)
#   bools[1] = status_ok     (true if status == "success")
on_chain:
  description: >
    AI-generated text detection result.
    Adaptable to any binary text authenticity API returning a 0/1 verdict
    and a status field.
  transform: direct
  min_price_usdc: 0.01
  fields:
    bools:
      - index: 0
        name: is_ai_text
        description: True if the text is AI-generated (source answer field equals 1).
        source_path: answer
        transform_rule: bool_from_int
      - index: 1
        name: status_ok
        description: True if the detection status is "success".
        source_path: status
        transform_rule: bool_from_eq:success
  request:
    - endpoint: detect
      method: POST
      body:
        text: { source: strings.0 }
